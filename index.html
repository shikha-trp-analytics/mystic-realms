<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f1b3a">
    <title>🦸 Mystic Realms · Magical Adventure Pixel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --deep-purple: #2a0e4a;
            --midnight-blue: #0f1b3a;
            --emerald: #2ecc71;
            --emerald-dark: #1e8449;
            --golden: #f1c40f;
            --golden-glow: #ffe066;
            --cyan: #00e5ff;
            --cyan-glow: #7ff0ff;
            --pink: #ff6ec7;
            --purple: #b06ab3;
            --bg-panel: rgba(20, 12, 40, 0.85);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: radial-gradient(ellipse at 20% 10%, rgba(176, 106, 179, 0.25), transparent 60%),
                        radial-gradient(ellipse at 80% 90%, rgba(0, 229, 255, 0.2), transparent 60%),
                        radial-gradient(circle at 50% 50%, #0f1b3a, #05070f 80%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Fira Mono', 'Courier New', monospace;
            padding: 20px;
            touch-action: none;
            position: fixed;
            inset: 0;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent),
                              radial-gradient(1px 1px at 70% 60%, #fff, transparent),
                              radial-gradient(1px 1px at 40% 80%, #fff, transparent),
                              radial-gradient(1px 1px at 90% 20%, #fff, transparent),
                              radial-gradient(1px 1px at 10% 70%, #fff, transparent),
                              radial-gradient(2px 2px at 50% 50%, #aaf, transparent);
            opacity: 0.5;
            pointer-events: none;
            animation: twinkle 5s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.7; }
        }

        /* ============================================
           ACHIEVEMENT TOAST — at TOP CENTER
           ============================================ */
        .achievement-toast {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #2a0e4a, #0f1b3a);
            border: 2px solid var(--golden);
            border-radius: 16px;
            padding: 14px 22px;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.7), 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10000;
            max-width: 320px;
            transition: top 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }

        .achievement-toast.show {
            top: 30px;
            opacity: 1;
        }

        .achievement-toast .ach-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        .achievement-toast .ach-text {
            font-size: 0.9rem;
            line-height: 1.3;
            text-align: left;
        }

        /* ============================================
           ROTATE DEVICE PROMPT
           ============================================ */
        .rotate-prompt {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, #1a0533, #05070f);
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 30px;
            gap: 24px;
        }

        .rotate-prompt .phone-icon {
            font-size: 5rem;
            animation: rotatePhone 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--cyan));
        }

        @keyframes rotatePhone {
            0%, 20% { transform: rotate(0deg); }
            50%, 70% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        .rotate-prompt h2 {
            font-size: 1.6rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--cyan);
            text-shadow: 0 0 20px var(--cyan);
            font-weight: 900;
        }

        .rotate-prompt p {
            font-size: 0.95rem;
            opacity: 0.8;
            max-width: 320px;
            line-height: 1.5;
        }

        /* Show rotate prompt only in portrait on touch devices */
        @media (orientation: portrait) and (max-width: 900px) and (hover: none) and (pointer: coarse) {
            .rotate-prompt {
                display: flex;
            }
            .game-container,
            .mobile-controls,
            .jump-label,
            .achievement-toast {
                display: none !important;
            }
        }

        /* ============================================
           GAME CONTAINER — ORIGINAL STYLING
           ============================================ */
        .game-container {
            position: relative;
            padding: 22px 26px 26px;
            border-radius: 28px;
            background: linear-gradient(160deg, rgba(30, 15, 55, 0.95), rgba(10, 8, 28, 0.98));
            border: 2px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 0 1px rgba(255, 110, 199, 0.3), 0 0 50px rgba(0, 229, 255, 0.3),
                        0 0 100px rgba(176, 106, 179, 0.2), 0 30px 60px -20px rgba(0, 0, 0, 0.95),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            max-width: 100%;
        }

        .game-container::before,
        .game-container::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            border: 3px solid var(--cyan);
            border-radius: 8px;
            box-shadow: 0 0 16px var(--cyan);
            pointer-events: none;
        }

        .game-container::before {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
        }

        .game-container::after {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
            border-color: var(--pink);
            box-shadow: 0 0 16px var(--pink);
        }

        .canvas-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            border-radius: 20px;
            padding: 6px;
            background: linear-gradient(135deg, var(--cyan), var(--pink), var(--purple));
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4), inset 0 0 20px rgba(0, 0, 0, 0.7);
        }

        canvas {
            display: block;
            border-radius: 16px;
            background: #0f1b3a;
            width: 100%;
            height: auto;
            max-width: 900px;
            cursor: pointer;
            transition: filter 0.2s;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.7) inset;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        canvas:active {
            filter: brightness(1.08);
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 14px;
            flex-wrap: wrap;
        }

        .hud {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border-radius: 16px;
            background: var(--bg-panel);
            border: 1px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: #eaf6ff;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .hud:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 28px rgba(0, 229, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .hud .icon {
            font-size: 1.2rem;
            filter: drop-shadow(0 0 8px rgba(255, 225, 77, 0.9));
        }

        .hud .value {
            color: var(--golden);
            font-family: 'Fira Mono', 'Courier New', monospace;
            font-size: 1.2rem;
            text-shadow: 0 0 12px rgba(255, 225, 77, 0.8);
            min-width: 22px;
            text-align: right;
        }

        .score .value {
            color: var(--emerald);
            text-shadow: 0 0 12px rgba(46, 204, 113, 0.8);
        }

        .level-box {
            border-color: rgba(255, 110, 199, 0.6);
            box-shadow: 0 0 18px rgba(255, 110, 199, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .level-box .value {
            color: var(--pink);
            text-shadow: 0 0 12px rgba(255, 110, 199, 0.9);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 16px;
            background: var(--bg-panel);
            border: 1px solid rgba(255, 225, 77, 0.4);
            box-shadow: 0 0 16px rgba(255, 225, 77, 0.15);
            font-size: 0.85rem;
            color: #cfe6f5;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .controls kbd {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            background: linear-gradient(180deg, #1a2a48, #0b1425);
            color: var(--golden);
            font-family: 'Fira Mono', 'Courier New', monospace;
            font-weight: 800;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 225, 77, 0.5);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-shadow: 0 0 8px rgba(255, 225, 77, 0.7);
        }

        .restart-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #0a0a1a;
            background: linear-gradient(135deg, var(--cyan), var(--emerald));
            box-shadow: 0 0 22px rgba(0, 229, 255, 0.6), 0 6px 0 rgba(0, 120, 140, 0.9),
                        0 10px 24px rgba(0, 0, 0, 0.7);
            transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .restart-btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 32px rgba(46, 204, 113, 0.8), 0 6px 0 rgba(0, 120, 140, 1),
                        0 12px 28px rgba(0, 0, 0, 0.8);
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 22px rgba(0, 229, 255, 0.6), 0 2px 0 rgba(0, 120, 140, 0.9),
                        0 6px 14px rgba(0, 0, 0, 0.7);
        }

        .double-jump-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.9), rgba(176, 106, 179, 0.9));
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
        }

        .double-jump-badge.show {
            opacity: 1;
            transform: translateX(-50%) translateY(5px);
        }

        /* ============================================
           MOBILE TOUCH CONTROLS
           ============================================ */
        .mobile-controls {
            display: none;
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 800;
        }

        .mobile-btn-group-left {
            position: absolute;
            left: max(18px, env(safe-area-inset-left, 0px) + 12px);
            bottom: max(18px, env(safe-area-inset-bottom, 0px) + 12px);
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .mobile-btn-group-right {
            position: absolute;
            right: max(18px, env(safe-area-inset-right, 0px) + 12px);
            bottom: max(18px, env(safe-area-inset-bottom, 0px) + 12px);
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .mobile-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.55);
            background: rgba(20, 12, 40, 0.78);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 1.6rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.1);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.1s, background 0.1s;
        }

        .mobile-btn:active,
        .mobile-btn.active {
            transform: scale(0.9);
            background: rgba(0, 229, 255, 0.5);
        }

        .mobile-btn.jump {
            width: 76px;
            height: 76px;
            background: rgba(255, 110, 199, 0.4);
            border-color: rgba(255, 110, 199, 0.85);
            box-shadow: 0 0 28px rgba(255, 110, 199, 0.7);
            font-size: 1.6rem;
        }

        .mobile-btn.jump:active,
        .mobile-btn.jump.active {
            background: rgba(255, 110, 199, 0.75);
        }

        .jump-label {
            position: absolute;
            right: max(30px, env(safe-area-inset-right, 0px) + 24px);
            bottom: max(102px, env(safe-area-inset-bottom, 0px) + 96px);
            color: var(--pink);
            font-weight: 900;
            font-size: 0.7rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--pink);
            pointer-events: none;
            opacity: 0.85;
            display: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .mobile-controls { display: block; }
            .jump-label { display: block; }
        }

        @media (hover: hover) and (pointer: fine) {
            .mobile-controls { display: none; }
            .jump-label { display: none; }
        }

        /* ============================================
           RESPONSIVE — ORIGINAL BREAKPOINTS
           ============================================ */
        @media (max-width: 820px) {
            .game-container {
                padding: 14px 14px 18px;
                border-radius: 20px;
            }
            .info-panel {
                gap: 8px;
                margin-top: 14px;
            }
            .hud {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            .hud .value {
                font-size: 1rem;
            }
            .controls {
                display: none;
            }
            .restart-btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
            .achievement-toast {
                padding: 10px 16px;
                font-size: 0.8rem;
                max-width: 280px;
            }
            .achievement-toast .ach-icon { font-size: 1.6rem; }
        }

        @media (max-width: 520px) {
            .game-container::before,
            .game-container::after {
                display: none;
            }
            .info-panel {
                justify-content: center;
            }
        }

        /* ============================================
           MOBILE LANDSCAPE — keeps original look but
           adapts sizing so game is fully visible
           ============================================ */
        @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
            body {
                padding: 6px;
            }

            .game-container {
                padding: 10px 12px 12px;
                border-radius: 20px;
                max-width: 100vw;
                max-height: 100vh;
                max-height: 100dvh;
            }

            .game-container::before,
            .game-container::after {
                width: 22px;
                height: 22px;
                top: 6px;
                left: 6px;
                bottom: 6px;
                right: 6px;
            }

            .canvas-wrapper {
                padding: 3px;
                border-radius: 14px;
            }

            canvas {
                border-radius: 12px;
                max-height: calc(100vh - 140px);
                max-height: calc(100dvh - 140px);
                width: auto;
                max-width: 100%;
            }

            .info-panel {
                margin-top: 8px;
                gap: 8px;
                flex-wrap: nowrap;
                justify-content: space-between;
            }

            .hud {
                padding: 6px 12px;
                font-size: 0.72rem;
                gap: 4px;
            }

            .hud .icon { font-size: 0.9rem; }
            .hud .value { font-size: 0.85rem; min-width: 16px; }

            .controls { display: none; }

            .restart-btn {
                padding: 7px 14px;
                font-size: 0.72rem;
            }
            .restart-btn span { font-size: 0.9rem; }

            .double-jump-badge {
                font-size: 0.62rem;
                padding: 5px 12px;
                top: 10px;
            }

            /* Mobile controls — sized for landscape, above bottom edge */
            .mobile-btn {
                width: 56px;
                height: 56px;
                font-size: 1.4rem;
            }
            .mobile-btn.jump {
                width: 68px;
                height: 68px;
                font-size: 1.4rem;
            }

            .mobile-btn-group-left {
                left: max(14px, env(safe-area-inset-left, 0px) + 10px);
                bottom: max(14px, env(safe-area-inset-bottom, 0px) + 10px);
            }

            .mobile-btn-group-right {
                right: max(14px, env(safe-area-inset-right, 0px) + 10px);
                bottom: max(14px, env(safe-area-inset-bottom, 0px) + 10px);
            }

            .jump-label {
                right: max(26px, env(safe-area-inset-right, 0px) + 20px);
                bottom: max(88px, env(safe-area-inset-bottom, 0px) + 84px);
                font-size: 0.6rem;
            }

            .achievement-toast {
                padding: 8px 14px;
                gap: 8px;
                max-width: 300px;
            }
            .achievement-toast .ach-icon { font-size: 1.4rem; }
            .achievement-toast .ach-text { font-size: 0.75rem; }
            .achievement-toast.show { top: 12px; }
        }
    </style>
</head>
<body>
    <!-- Rotate device prompt (shown in portrait on mobile) -->
    <div class="rotate-prompt" id="rotatePrompt">
        <div class="phone-icon">📱</div>
        <h2>Rotate Your Device</h2>
        <p>This game is designed for landscape mode. Please turn your device horizontally to play.</p>
    </div>

    <div class="game-container">
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="900" height="450"></canvas>
            <div id="doubleJumpBadge" class="double-jump-badge">✦ Double Jump Available ✦</div>
        </div>
        <div class="info-panel">
            <div class="hud score">
                <span class="icon">⭐</span>
                <span>Score</span>
                <span class="value" id="scoreDisplay">0</span>
            </div>
            <div class="hud level-box">
                <span class="icon">🎮</span>
                <span>Level</span>
                <span class="value"><span id="levelDisplay">1</span>/10</span>
            </div>
            <div class="controls">
                <kbd>←</kbd><kbd>→</kbd> Move
                <kbd>Space</kbd> Jump (x2!)
            </div>
            <button class="restart-btn" id="restartButton">
                <span>↻</span> Restart
            </button>
        </div>
    </div>

    <!-- Achievement toast at TOP CENTER -->
    <div id="achievementToast" class="achievement-toast">
        <span class="ach-icon">🏆</span>
        <span class="ach-text" id="achievementText"></span>
    </div>

    <!-- Mobile touch controls -->
    <div class="mobile-controls">
        <div class="mobile-btn-group-left">
            <button class="mobile-btn" id="mobileLeft" aria-label="Move left">◀</button>
            <button class="mobile-btn" id="mobileRight" aria-label="Move right">▶</button>
        </div>
        <div class="mobile-btn-group-right">
            <button class="mobile-btn jump" id="mobileJump" aria-label="Jump">▲</button>
        </div>
    </div>
    <div class="jump-label">JUMP</div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const levelSpan = document.getElementById('levelDisplay');
            const achievementToast = document.getElementById('achievementToast');
            const achievementText = document.getElementById('achievementText');
            const doubleJumpBadge = document.getElementById('doubleJumpBadge');
            const W = 900, H = 450;

            const achievements = {
                firstCoin: { name: 'First Sparkle', desc: 'Collect your first coin', icon: '✨', earned: false },
                coinHunter: { name: 'Treasure Hunter', desc: 'Collect 10 coins', icon: '💰', earned: false },
                bossSlayer: { name: 'Boss Slayer', desc: 'Defeat a boss', icon: '⚔️', earned: false },
                hiddenGem: { name: 'Secret Seeker', desc: 'Find a hidden treasure', icon: '💎', earned: false },
                level5: { name: 'Halfway Hero', desc: 'Reach level 5', icon: '🏅', earned: false },
                allDone: { name: 'Mystic Master', desc: 'Complete all 10 levels', icon: '👑', earned: false },
                perfect: { name: 'Flawless Victory', desc: 'Complete a level without damage', icon: '🛡️', earned: false },
                doubleJumper: { name: 'Sky Dancer', desc: 'Perform a double jump', icon: '🦋', earned: false },
                spikyDodge: { name: 'Untouchable', desc: 'Defeat a spiky enemy with a star', icon: '🌟', earned: false }
            };

            function showAchievement(key) {
                const ach = achievements[key];
                if (!ach || ach.earned) return;
                ach.earned = true;
                achievementText.innerHTML = `<strong>${ach.name}</strong><br><span style="font-size:0.7rem;opacity:0.8">${ach.desc}</span>`;
                achievementToast.querySelector('.ach-icon').textContent = ach.icon;
                achievementToast.classList.add('show');
                clearTimeout(showAchievement._t);
                showAchievement._t = setTimeout(() => achievementToast.classList.remove('show'), 3500);
            }

            const THEMES = [{
                name: 'Enchanted Forest',
                sky1: '#1a0533', sky2: '#2a0e4a', sky3: '#0f1b3a', sky4: '#1a2a4a',
                ground: '#1e8449', groundTop: '#2ecc71', brick: '#4a235a', brickAccent: '#6c3483',
                accent: '#00e5ff', firefly: '#f1c40f'
            }, {
                name: 'Mystic Grove',
                sky1: '#0d1b2a', sky2: '#1b263b', sky3: '#2d3e50', sky4: '#1a2a3a',
                ground: '#1b5e20', groundTop: '#43a047', brick: '#37474f', brickAccent: '#546e7a',

                const L = LEVELS[idx];
                WORLD_W = L.worldW;

                const speedMult = ENEMY_SCALING.speedMultiplier(idx);

                    let baseVx = 1.2;
                    if (e.type === 'koopa') baseVx = 1.2 * koopaMult;
                    else if (e.type === 'spiky') baseVx = 1.0 * spikyMult;
                    else baseVx = 1.2 * speedMult;
                    return { ...e, vx: baseVx };
                });

                if (idx >= ENEMY_SCALING.spikyFromLevel) {
                    enemies.forEach((e, i) => {
                        if (e.type === 'goomba' && i % 2 === 1 && Math.random() < 0.4) {

                            e.w = 30;
                            e.h = 30;

            function updatePlayer() {
                if (gameOver || levelComplete) return;

                if (shieldTimer > 0) {
                    shieldTimer--;
                    if (shieldTimer <= 0) shieldActive = false;

                if (invincibleTimer > 0) invincibleTimer--;
                if (speedBoostTimer > 0) {
                    speedBoostTimer--;
                    if (speedBoostTimer <= 0) player.speed = player.baseSpeed;

                if (player.doubleJumpEffect > 0) player.doubleJumpEffect--;

                if (player.wasOnGround && !player.onGround) {
                    player.coyoteTimer = 8;

                    player.coyoteTimer--;
                }

                const jumpJustPressed = spaceJustPressed || mobileJumpPressed;
                if (jumpJustPressed) {
                    player.jumpBufferTimer = 8;
                    spaceJustPressed = false;
                    mobileJumpPressed = false;
                } else if (player.jumpBufferTimer > 0) {
                    player.jumpBufferTimer--;
                }

                let move = 0;
                if (keys.ArrowRight || keys.KeyD || mobileRightPressed) move += 1;
                if (keys.ArrowLeft || keys.KeyA || mobileLeftPressed) move -= 1;

                if (move !== 0) {
                    player.vx = move * player.speed;
                    player.facing = move;
                    player.walkTimer += 1;
                    if (player.walkTimer > 8) {
                        player.walkTimer = 0;
                        player.walkFrame = (player.walkFrame + 1) % 4;
                    }
                    player.idleTimer = 0;
                } else {

                        player.jumpsUsed = 1;
                        player.airJumpsRemaining = DOUBLE_JUMP_ENABLED ? 1 : 0;
                        player.jumpBufferTimer = 0;
                        spawnParticles(player.x + player.width / 2, player.y + player.height, '#00e5ff', 6);
                    } else if (canAirJump) {
                        player.vy = player.jumpPower * 0.85;
                        player.airJumpsRemaining = 0;
                        player.jumpsUsed = 2;
                        player.doubleJumpEffect = 20;
