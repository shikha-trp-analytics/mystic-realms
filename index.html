<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦸 Mystic Realms · Magical Adventure Pixel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
         :root {
            --deep-purple: #2a0e4a;
            --midnight-blue: #0f1b3a;
            --emerald: #2ecc71;
            --emerald-dark: #1e8449;
            --golden: #f1c40f;
            --golden-glow: #ffe066;
            --cyan: #00e5ff;
            --cyan-glow: #7ff0ff;
            --pink: #ff6ec7;
            --purple: #b06ab3;
            --bg-panel: rgba(20, 12, 40, 0.85);
        }
        
        body {
            background: radial-gradient(ellipse at 20% 10%, rgba(176, 106, 179, 0.25), transparent 60%), radial-gradient(ellipse at 80% 90%, rgba(0, 229, 255, 0.2), transparent 60%), radial-gradient(circle at 50% 50%, #0f1b3a, #05070f 80%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Fira Mono', 'Courier New', monospace;
            padding: 20px;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 60%, #fff, transparent), radial-gradient(1px 1px at 40% 80%, #fff, transparent), radial-gradient(1px 1px at 90% 20%, #fff, transparent), radial-gradient(1px 1px at 10% 70%, #fff, transparent), radial-gradient(2px 2px at 50% 50%, #aaf, transparent);
            opacity: 0.5;
            pointer-events: none;
            animation: twinkle 5s ease-in-out infinite alternate;
        }
        
        @keyframes twinkle {
            0% {
                opacity: 0.3;
            }
            100% {
                opacity: 0.7;
            }
        }
        
        .game-container {
            position: relative;
            padding: 22px 26px 26px;
            border-radius: 28px;
            background: linear-gradient(160deg, rgba(30, 15, 55, 0.95), rgba(10, 8, 28, 0.98));
            border: 2px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 0 1px rgba(255, 110, 199, 0.3), 0 0 50px rgba(0, 229, 255, 0.3), 0 0 100px rgba(176, 106, 179, 0.2), 0 30px 60px -20px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            max-width: 100%;
        }
        
        .game-container::before,
        .game-container::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            border: 3px solid var(--cyan);
            border-radius: 8px;
            box-shadow: 0 0 16px var(--cyan);
            pointer-events: none;
        }
        
        .game-container::before {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
        }
        
        .game-container::after {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
            border-color: var(--pink);
            box-shadow: 0 0 16px var(--pink);
        }
        
        .canvas-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            border-radius: 20px;
            padding: 6px;
            background: linear-gradient(135deg, var(--cyan), var(--pink), var(--purple));
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4), inset 0 0 20px rgba(0, 0, 0, 0.7);
        }
        
        canvas {
            display: block;
            border-radius: 16px;
            background: #0f1b3a;
            width: 100%;
            height: auto;
            max-width: 900px;
            cursor: pointer;
            transition: filter 0.2s;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.7) inset;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        canvas:active {
            filter: brightness(1.08);
        }
        
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 14px;
            flex-wrap: wrap;
        }
        
        .hud {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            border-radius: 16px;
            background: var(--bg-panel);
            border: 1px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: #eaf6ff;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        
        .hud:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 28px rgba(0, 229, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        
        .hud .icon {
            font-size: 1.2rem;
            filter: drop-shadow(0 0 8px rgba(255, 225, 77, 0.9));
        }
        
        .hud .value {
            color: var(--golden);
            font-family: 'Fira Mono', 'Courier New', monospace;
            font-size: 1.2rem;
            text-shadow: 0 0 12px rgba(255, 225, 77, 0.8);
            min-width: 22px;
            text-align: right;
        }
        
        .score .value {
            color: var(--emerald);
            text-shadow: 0 0 12px rgba(46, 204, 113, 0.8);
        }
        
        .level-box {
            border-color: rgba(255, 110, 199, 0.6);
            box-shadow: 0 0 18px rgba(255, 110, 199, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .level-box .value {
            color: var(--pink);
            text-shadow: 0 0 12px rgba(255, 110, 199, 0.9);
        }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 16px;
            background: var(--bg-panel);
            border: 1px solid rgba(255, 225, 77, 0.4);
            box-shadow: 0 0 16px rgba(255, 225, 77, 0.15);
            font-size: 0.85rem;
            color: #cfe6f5;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .controls kbd {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            background: linear-gradient(180deg, #1a2a48, #0b1425);
            color: var(--golden);
            font-family: 'Fira Mono', 'Courier New', monospace;
            font-weight: 800;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 225, 77, 0.5);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            text-shadow: 0 0 8px rgba(255, 225, 77, 0.7);
        }
        
        .restart-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #0a0a1a;
            background: linear-gradient(135deg, var(--cyan), var(--emerald));
            box-shadow: 0 0 22px rgba(0, 229, 255, 0.6), 0 6px 0 rgba(0, 120, 140, 0.9), 0 10px 24px rgba(0, 0, 0, 0.7);
            transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }
        
        .restart-btn:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 32px rgba(46, 204, 113, 0.8), 0 6px 0 rgba(0, 120, 140, 1), 0 12px 28px rgba(0, 0, 0, 0.8);
        }
        
        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 22px rgba(0, 229, 255, 0.6), 0 2px 0 rgba(0, 120, 140, 0.9), 0 6px 14px rgba(0, 0, 0, 0.7);
        }
        
        .achievement-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #2a0e4a, #0f1b3a);
            border: 2px solid var(--golden);
            border-radius: 16px;
            padding: 14px 22px;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 320px;
        }
        
        .achievement-toast.show {
            transform: translateX(0);
        }
        
        .achievement-toast .ach-icon {
            font-size: 2rem;
        }
        
        .achievement-toast .ach-text {
            font-size: 0.9rem;
            line-height: 1.3;
        }
        
        @media (max-width: 820px) {
            .game-container {
                padding: 14px 14px 18px;
                border-radius: 20px;
            }
            .info-panel {
                gap: 8px;
                margin-top: 14px;
            }
            .hud {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            .hud .value {
                font-size: 1rem;
            }
            .controls {
                display: none;
            }
            .restart-btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
            .achievement-toast {
                bottom: 15px;
                right: 15px;
                padding: 10px 16px;
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 520px) {
            .game-container::before,
            .game-container::after {
                display: none;
            }
            .info-panel {
                justify-content: center;
            }
        }
    </style>
</head>

                return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

                if (keys.ArrowRight || keys.KeyD) move += 1;
                if (keys.ArrowLeft || keys.KeyA) move -= 1;

                    player.facing = move;

                    if (player.walkTimer > 8) {

                    }
                    player.idleTimer = 0;

                    if (Math.abs(player.vx) < 0.2) player.vx = 0;
                    player.walkFrame = 0;
                    player.idleTimer++;
                }

                if ((keys.Space || keys.KeyW) && player.onGround) {
                    player.vy = player.jumpPower;
                    player.onGround = false;
                }

                player.vy += 0.50;
                if (player.vy > 14) player.vy = 14;

                player.x += player.vx;
                if (player.x < 0) {
                    player.x = 0;
                    player.vx = 0;
                }
                if (player.x + player.width > WORLD_W) {
                    player.x = WORLD_W - player.width;

                            player.vy = 0;
                            player.onGround = true;
                        } else if (player.vy < 0 && player.y - player.vy >= p.y + p.h - 2) {
                            player.y = p.y + p.h;
                            player.vy = 0;
                        } else {
                            if (player.x + player.width / 2 < p.x + p.w / 2) player.x = p.x - player.width;
                            else player.x = p.x + p.w;
                            player.vx = 0;

                if (player.y + player.height > H) {

                            player.lives = Math.min(player.lives + 1, 5);
                        } else if (pu.type === 'shield') {
                            shieldActive = true;
                            shieldTimer = 300;
                        } else if (pu.type === 'star') {
                            invincibleTimer = 180;
                            player.speed = player.baseSpeed * 1.6;
                            speedBoostTimer = 180;
                        }
                    }
                }

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const pt = particles[i];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.vy += pt.gravity || 0.15;
                    pt.life--;
                    if (pt.life <= 0) particles.splice(i, 1);
                }

                // Ambient particles
                for (const ap of ambientParticles) {
                    ap.x += ap.vx;
                    ap.y += ap.vy;
                    ap.phase += 0.02;
                    if (ap.x < cameraX - 100) ap.x = cameraX + W + 50;
                    if (ap.x > cameraX + W + 100) ap.x = cameraX - 50;
                    if (ap.y < 50) ap.y = 350;
                    if (ap.y > 380) ap.y = 60;
                }

                const targetCam = player.x - W / 2 + player.width / 2;
                cameraX = Math.max(0, Math.min(targetCam, WORLD_W - W));
            }

            // ---------- DRAW HELPERS ----------
            function drawBackground(theme) {
                // Sky gradient
                const sky = ctx.createLinearGradient(0, 0, 0, H);
                sky.addColorStop(0.00, theme.sky1);
                sky.addColorStop(0.30, theme.sky2);
                sky.addColorStop(0.60, theme.sky3);
                sky.addColorStop(0.85, theme.sky4);
                sky.addColorStop(1.00, theme.sky3);
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, W, H);

                // Stars (layer 0)
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                for (let i = 0; i < 50; i++) {
                    const sx = (i * 137) % W;
                    const sy = (i * 89) % 280;
                    const tw = 0.5 + Math.sin(animTimer * 0.02 + i) * 0.5;
                    ctx.globalAlpha = 0.2 + tw * 0.5;
                    ctx.fillRect(sx, sy, 1.5, 1.5);
                }
                ctx.globalAlpha = 1;

                // Moon/glow
                const moonGlow = ctx.createRadialGradient(720, 80, 10, 720, 80, 120);
                moonGlow.addColorStop(0, 'rgba(200, 220, 255, 0.8)');
                moonGlow.addColorStop(0.5, 'rgba(150, 180, 255, 0.3)');
                moonGlow.addColorStop(1, 'rgba(100, 120, 200, 0)');
                ctx.fillStyle = moonGlow;
                ctx.fillRect(600, -40, 240, 240);
                ctx.fillStyle = '#ddeeff';
                ctx.beginPath();
                ctx.arc(720, 80, 38, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(200,210,240,0.4)';
                ctx.beginPath();
                ctx.arc(710, 70, 7, 0, Math.PI * 2);
                ctx.arc(730, 90, 5, 0, Math.PI * 2);
                ctx.arc(725, 65, 4, 0, Math.PI * 2);
                ctx.fill();

                // Far mountains (layer 1, parallax 0.08)
                ctx.fillStyle = 'rgba(30, 20, 60, 0.6)';
                const off1 = (cameraX * 0.08) % 600;
                for (let i = -1; i < 4; i++) {
                    const bx = i * 600 - off1;
                    ctx.beginPath();
                    ctx.moveTo(bx, 380);
                    ctx.lineTo(bx + 150, 160);
                    ctx.lineTo(bx + 300, 380);
                    ctx.moveTo(bx + 200, 380);
                    ctx.lineTo(bx + 380, 200);
                    ctx.lineTo(bx + 540, 380);
                    ctx.fill();
                }

                // Mid trees (layer 2, parallax 0.15)
                ctx.fillStyle = 'rgba(15, 30, 25, 0.75)';
                const off2 = (cameraX * 0.15) % 400;
                for (let i = -1; i < 5; i++) {
                    const bx = i * 400 - off2;
                    // Tree trunk
                    ctx.fillRect(bx + 60, 260, 12, 120);
                    ctx.fillRect(bx + 300, 240, 10, 140);
                    // Tree canopy
                    ctx.beginPath();
                    ctx.arc(bx + 66, 250, 45, 0, Math.PI * 2);
                    ctx.arc(bx + 40, 270, 35, 0, Math.PI * 2);
                    ctx.arc(bx + 92, 270, 35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(bx + 305, 230, 40, 0, Math.PI * 2);
                    ctx.arc(bx + 280, 250, 30, 0, Math.PI * 2);
                    ctx.arc(bx + 330, 250, 30, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Near trees with detail (layer 3, parallax 0.3)
                const off3 = (cameraX * 0.3) % 350;
                for (let i = -1; i < 5; i++) {
                    const bx = i * 350 - off3;
                    // Trunk with texture
                    ctx.fillStyle = '#3d2b1a';
                    ctx.fillRect(bx + 30, 280, 16, 100);
                    ctx.fillStyle = '#5c3a1e';
                    ctx.fillRect(bx + 32, 285, 4, 90);
                    ctx.fillStyle = '#2a1a0a';
                    ctx.fillRect(bx + 40, 290, 2, 85);
                    // Canopy layers
                    ctx.fillStyle = 'rgba(20, 50, 30, 0.9)';
                    ctx.beginPath();
                    ctx.arc(bx + 38, 270, 50, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(30, 70, 40, 0.8)';
                    ctx.beginPath();
                    ctx.arc(bx + 38, 260, 42, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(40, 90, 50, 0.7)';
                    ctx.beginPath();
                    ctx.arc(bx + 38, 250, 32, 0, Math.PI * 2);
                    ctx.fill();
                    // Hanging moss/vines
                    ctx.strokeStyle = 'rgba(20, 60, 40, 0.8)';
                    ctx.lineWidth = 2;
                    for (let j = 0; j < 5; j++) {
                        const vx = bx + 10 + j * 12;
                        const vy = 290 + Math.sin(animTimer * 0.01 + j) * 5;
                        ctx.beginPath();
                        ctx.moveTo(vx, 300);
                        ctx.quadraticCurveTo(vx + 3, vy + 20, vx, vy + 35);
                        ctx.stroke();
                    }
                }

                // Ground fog/mist (layer 4)
                const fog = ctx.createLinearGradient(0, 320, 0, 400);
                fog.addColorStop(0, 'rgba(20, 40, 50, 0)');
                fog.addColorStop(0.5, 'rgba(20, 40, 50, 0.3)');
                fog.addColorStop(1, 'rgba(10, 20, 30, 0.6)');
                ctx.fillStyle = fog;
                ctx.fillRect(0, 320, W, 80);

                // Ambient fireflies and floating leaves
                for (const ap of ambientParticles) {
                    const sx = ap.x - cameraX;
                    if (sx < -20 || sx > W + 20) continue;
                    if (ap.type === 'firefly') {
                        const glow = 0.5 + Math.sin(ap.phase * 2) * 0.5;
                        ctx.fillStyle = `rgba(241, 196, 15, ${0.3 + glow * 0.5})`;
                        ctx.shadowColor = '#f1c40f';
                        ctx.shadowBlur = 8 + glow * 8;
                        ctx.beginPath();
                        ctx.arc(sx, ap.y, ap.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    } else {
                        ctx.fillStyle = `rgba(100, 150, 80, ${0.3 + Math.sin(ap.phase) * 0.2})`;
                        ctx.save();
                        ctx.translate(sx, ap.y);
                        ctx.rotate(ap.phase * 0.5);
                        ctx.fillRect(-3, -1, 6, 2);
                        ctx.restore();
                    }
                }
            }

            function drawWaterfalls(theme) {
                // Waterfalls in the background
                for (let i = 0; i < 2; i++) {
                    const wx = (200 + i * 450) - (cameraX * 0.12) % 900;
                    if (wx > -50 && wx < W + 50) {
                        const flow = (animTimer * 2) % 20;
                        const grad = ctx.createLinearGradient(wx, 200, wx, 380);
                        grad.addColorStop(0, 'rgba(100, 200, 255, 0.1)');
                        grad.addColorStop(0.5, 'rgba(100, 200, 255, 0.4)');
                        grad.addColorStop(1, 'rgba(100, 200, 255, 0.6)');
                        ctx.fillStyle = grad;
                        for (let j = 0; j < 6; j++) {
                            const offset = (flow + j * 4) % 20;
                            ctx.fillRect(wx + j * 4, 220 + offset, 3, 140 - offset);
                        }
                        // Splash
                        ctx.fillStyle = 'rgba(150, 220, 255, 0.4)';
                        for (let j = 0; j < 4; j++) {
                            const sx = wx + 5 + Math.sin(animTimer * 0.05 + j) * 10;
                            const sy = 370 + Math.cos(animTimer * 0.08 + j) * 5;
                            ctx.beginPath();
                            ctx.arc(sx, sy, 3 + j, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }

            function drawPlatforms(theme) {
                for (const p of platforms) {
                    if (p.x + p.w < cameraX - 20 || p.x > cameraX + W + 20) continue;
                    const sx = p.x - cameraX;
                    if (p.type === 'ground') {
                        // Ground base
                        ctx.fillStyle = theme.ground;
                        ctx.fillRect(sx, p.y, p.w, p.h);
                        ctx.fillStyle = theme.groundTop;
                        ctx.fillRect(sx, p.y, p.w, 14);
                        // Grass blades
                        ctx.fillStyle = theme.groundTop;
                        for (let i = 0; i < p.w; i += 8) {
                            const bladeH = 3 + Math.sin(i * 0.5 + animTimer * 0.03) * 3;
                            ctx.fillRect(sx + i, p.y - bladeH, 3, bladeH);
                        }
                        // Flowers
                        for (let i = 20; i < p.w; i += 60) {
                            const fx = sx + i;
                            const fy = p.y - 6;
                            const flowerColor = i % 120 === 20 ? '#ff6ec7' : '#ffe066';
                            ctx.fillStyle = flowerColor;
                            ctx.beginPath();
                            ctx.arc(fx, fy, 3, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = '#fff';
                            ctx.beginPath();
                            ctx.arc(fx, fy, 1.5, 0, Math.PI * 2);
                            ctx.fill();
                            // Stem
                            ctx.strokeStyle = '#1e8449';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(fx, fy + 3);
                            ctx.lineTo(fx, fy + 8);
                            ctx.stroke();
                        }
                        // Dirt texture
                        ctx.fillStyle = 'rgba(0,0,0,0.15)';
                        for (let i = 0; i < p.w; i += 40) {
                            ctx.fillRect(sx + i, p.y + 25, 10, 8);
                            ctx.fillRect(sx + i + 20, p.y + 45, 14, 8);
                        }
                        // Stones
                        ctx.fillStyle = 'rgba(100,100,100,0.4)';
                        for (let i = 15; i < p.w; i += 75) {
                            ctx.beginPath();
                            ctx.ellipse(sx + i, p.y + 40, 6, 4, 0, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(sx, p.y, p.w, p.h);
                        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(sx + 2, p.y + 2);
                        ctx.lineTo(sx + p.w - 2, p.y + 2);
                        ctx.stroke();
                    } else {
                        // Floating magical brick platform
                        // Glow aura
                        ctx.shadowColor = theme.accent;
                        ctx.shadowBlur = 12;
                        ctx.fillStyle = theme.brick;
                        ctx.fillRect(sx, p.y, p.w, p.h);
                        ctx.shadowBlur = 0;
                        // Top highlight
                        ctx.fillStyle = theme.brickAccent;
                        ctx.fillRect(sx, p.y, p.w, 3);
                        // Runes
                        ctx.fillStyle = theme.accent;
                        for (let i = 0; i < p.w; i += 25) {
                            const runeY = p.y + 6 + Math.sin(animTimer * 0.05 + i) * 2;
                            ctx.fillRect(sx + i + 6, runeY, 3, 6);
                        }
                        // Stone texture
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        for (let i = 0; i < p.w; i += 15) {
                            ctx.fillRect(sx + i, p.y + 10, 8, 4);
                        }
                        ctx.strokeStyle = theme.accent;
                        ctx.lineWidth = 1.5;
                        ctx.strokeRect(sx, p.y, p.w, p.h);
                        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(sx + 1, p.y + 1, p.w - 2, p.h - 2);
                    }
                }
            }

            function drawCoins() {
                for (const c of coins) {
                    if (c.collected) continue;
                    const sx = c.x - cameraX;
                    if (sx < -30 || sx > W + 30) continue;
                    const bob = Math.sin(animTimer * 0.06 + c.x) * 3;
                    const rot = Math.sin(animTimer * 0.08 + c.x) * 0.3;
                    // Glow
                    ctx.shadowColor = '#f1c40f';
                    ctx.shadowBlur = 25;
                    ctx.save();
                    ctx.translate(sx, c.y + bob);
                    ctx.scale(1 - Math.abs(rot) * 0.3, 1);
                    // Coin body
                    ctx.beginPath();
                    ctx.arc(0, 0, c.r, 0, Math.PI * 2);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fill();
                    // Inner ring
                    ctx.strokeStyle = '#b7950b';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, c.r - 2, 0, Math.PI * 2);
                    ctx.stroke();
                    // Shine
                    ctx.fillStyle = '#fff9c4';
                    ctx.beginPath();
                    ctx.arc(-4, -4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    // Star symbol
                    ctx.fillStyle = '#b7950b';
                    ctx.font = 'bold 16px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('★', 0, 1);
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'alphabetic';
                    ctx.restore();
                    ctx.shadowBlur = 0;
                }
            }

            function drawTreasures() {
                for (const t of treasures) {
                    if (t.found) continue;
                    const sx = t.x - cameraX;
                    if (sx < -60 || sx > W + 60) continue;
                    const bob = Math.sin(animTimer * 0.04 + t.x) * 4;
                    const pulse = 0.7 + Math.sin(animTimer * 0.08) * 0.3;
                    ctx.shadowColor = '#b06ab3';
                    ctx.shadowBlur = 25 + pulse * 10;
                    // Gem shape
                    ctx.fillStyle = '#b06ab3';
                    ctx.beginPath();
                    ctx.moveTo(sx + t.w / 2, t.y + bob);
                    ctx.lineTo(sx + t.w, t.y + t.h / 2 + bob);
                    ctx.lineTo(sx + t.w / 2, t.y + t.h + bob);
                    ctx.lineTo(sx, t.y + t.h / 2 + bob);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Inner facets
                    ctx.fillStyle = '#e8daef';
                    ctx.beginPath();
                    ctx.moveTo(sx + t.w / 2, t.y + 4 + bob);
                    ctx.lineTo(sx + t.w - 6, t.y + t.h / 2 + bob);
                    ctx.lineTo(sx + t.w / 2, t.y + t.h - 4 + bob);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#d2b4de';
                    ctx.beginPath();
                    ctx.moveTo(sx + t.w / 2, t.y + 4 + bob);
                    ctx.lineTo(sx + 6, t.y + t.h / 2 + bob);
                    ctx.lineTo(sx + t.w / 2, t.y + t.h - 4 + bob);
                    ctx.closePath();
                    ctx.fill();
                    // Sparkle
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(sx + t.w / 2, t.y + t.h / 2 + bob, 3 + pulse * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawEnemies() {
                for (const e of enemies) {
                    if (!e.alive) continue;
                    const sx = e.x - cameraX;
                    if (sx < -60 || sx > W + 60) continue;
                    const anim = Math.floor(animTimer / 8) % 2;
                    if (e.type === 'goomba') {
                        // Shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.beginPath();
                        ctx.ellipse(sx + e.w / 2, e.y + e.h + 2, e.w * 0.5, 3, 0, 0, Math.PI * 2);
                        ctx.fill();
                        // Body
                        ctx.fillStyle = '#8b4513';
                        ctx.beginPath();
                        ctx.ellipse(sx + e.w / 2, e.y + e.h / 2, e.w / 2, e.h / 2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#a0522d';
                        ctx.beginPath();
                        ctx.ellipse(sx + e.w / 2, e.y + e.h / 2 - 3, e.w / 2 - 2, e.h / 2 - 4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        // Eyes
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(sx + e.w * 0.3, e.y + e.h * 0.4, 5, 0, Math.PI * 2);
                        ctx.arc(sx + e.w * 0.7, e.y + e.h * 0.4, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(sx + e.w * 0.3 + e.dir * anim, e.y + e.h * 0.4, 2.5, 0, Math.PI * 2);
                        ctx.arc(sx + e.w * 0.7 + e.dir * anim, e.y + e.h * 0.4, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        // Angry brows
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(sx + e.w * 0.2, e.y + e.h * 0.25);
                        ctx.lineTo(sx + e.w * 0.4, e.y + e.h * 0.35);
                        ctx.moveTo(sx + e.w * 0.8, e.y + e.h * 0.25);
                        ctx.lineTo(sx + e.w * 0.6, e.y + e.h * 0.35);
                        ctx.stroke();
                        // Feet
                        ctx.fillStyle = '#5c2e0a';
                        ctx.fillRect(sx + 2 + anim * 2, e.y + e.h - 4, 8, 4);
                        ctx.fillRect(sx + e.w - 10 - anim * 2, e.y + e.h - 4, 8, 4);
                    } else {
                        // Koopa (magical turtle)
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.beginPath();
                        ctx.ellipse(sx + e.w / 2, e.y + e.h + 2, e.w * 0.5, 3, 0, 0, Math.PI * 2);
                        ctx.fill();
                        // Shell
                        ctx.fillStyle = '#1e8449';
                        ctx.beginPath();
                        ctx.ellipse(sx + e.w / 2, e.y + e.h / 2, e.w / 2, e.h / 2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#27ae60';
                        ctx.beginPath();
                        ctx.ellipse(sx + e.w / 2, e.y + e.h / 2 - 2, e.w / 2 - 3, e.h / 2 - 4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        // Shell pattern
                        ctx.strokeStyle = '#0e3d24';
                        ctx.lineWidth = 2;
                        for (let i = 0; i < 3; i++) {
                            ctx.beginPath();
                            ctx.arc(sx + e.w / 2, e.y + e.h / 2, 6 + i * 4, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        // Head
                        ctx.fillStyle = '#f4d03f';
                        ctx.beginPath();
                        ctx.arc(sx + e.w / 2 + e.dir * 10, e.y + 6, 6, 0, Math.PI * 2);
                        ctx.fill();
                        // Eye
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(sx + e.w / 2 + e.dir * 10 + e.dir * 2, e.y + 5, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                        // Feet
                        ctx.fillStyle = '#f4d03f';
                        ctx.fillRect(sx + 4 + anim * 2, e.y + e.h - 3, 6, 3);
                        ctx.fillRect(sx + e.w - 10 - anim * 2, e.y + e.h - 3, 6, 3);
                    }
                }

                // Boss
                if (boss && boss.alive) {
                    const sx = boss.x - cameraX;
                    const pulse = Math.sin(animTimer * 0.06) * 3;
                    // Aura
                    ctx.shadowColor = '#ff6ec7';
                    ctx.shadowBlur = 30 + pulse * 2;
                    ctx.fillStyle = 'rgba(74, 35, 90, 0.8)';
                    ctx.beginPath();
                    ctx.arc(sx + boss.w / 2, boss.y + boss.h / 2, boss.w / 2 + 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Body
                    ctx.fillStyle = '#b06ab3';
                    ctx.beginPath();
                    ctx.ellipse(sx + boss.w / 2, boss.y + boss.h / 2, boss.w / 2, boss.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Armor detail
                    ctx.fillStyle = '#7d3c98';
                    ctx.beginPath();
                    ctx.ellipse(sx + boss.w / 2, boss.y + boss.h / 2 - 4, boss.w / 2 - 4, boss.h / 2 - 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(sx + boss.w * 0.35, boss.y + boss.h * 0.4, 8, 0, Math.PI * 2);
                    ctx.arc(sx + boss.w * 0.65, boss.y + boss.h * 0.4, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#e63946';
                    ctx.beginPath();
                    ctx.arc(sx + boss.w * 0.35 + boss.dir * 2, boss.y + boss.h * 0.4, 4, 0, Math.PI * 2);
                    ctx.arc(sx + boss.w * 0.65 + boss.dir * 2, boss.y + boss.h * 0.4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    // Crown
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();
                    ctx.moveTo(sx + boss.w * 0.2, boss.y - 5);
                    ctx.lineTo(sx + boss.w * 0.3, boss.y - 22);
                    ctx.lineTo(sx + boss.w * 0.5, boss.y - 10);
                    ctx.lineTo(sx + boss.w * 0.7, boss.y - 22);
                    ctx.lineTo(sx + boss.w * 0.8, boss.y - 5);
                    ctx.fill();
                    // Crown jewels
                    ctx.fillStyle = '#ff6ec7';
                    ctx.beginPath();
                    ctx.arc(sx + boss.w * 0.5, boss.y - 12, 3, 0, Math.PI * 2);
                    ctx.fill();
                    // HP bar
                    ctx.fillStyle = '#1a0a2e';
                    ctx.fillRect(sx + boss.w / 2 - 30, boss.y - 45, 60, 8);
                    ctx.fillStyle = '#ff6ec7';
                    ctx.fillRect(sx + boss.w / 2 - 30, boss.y - 45, 60 * (boss.hp / boss.maxHp), 8);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(sx + boss.w / 2 - 30, boss.y - 45, 60, 8);
                }
            }

            function drawGerms() {
                for (const g of germs) {
                    if (!g.alive) continue;
                    const sx = g.x - cameraX;
                    if (sx < -60 || sx > W + 60) continue;
                    const t = animTimer * 0.05;
                    const pulse = 0.8 + Math.sin(t) * 0.2;
                    // Glow
                    ctx.shadowColor = '#b06ab3';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#9b59b6';
                    ctx.beginPath();
                    ctx.arc(sx + g.w / 2, g.y + g.h / 2, g.w / 2 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Spikes
                    ctx.strokeStyle = '#7d3c98';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 8; i++) {
                        const a = (i / 8) * Math.PI * 2 + t;
                        ctx.beginPath();
                        ctx.moveTo(sx + g.w / 2 + Math.cos(a) * (g.w / 2 * pulse), g.y + g.h / 2 + Math.sin(a) * (g.h / 2 * pulse));
                        ctx.lineTo(sx + g.w / 2 + Math.cos(a) * (g.w / 2 * pulse + 5), g.y + g.h / 2 + Math.sin(a) * (g.h / 2 * pulse + 5));
                        ctx.stroke();
                    }
                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(sx + g.w * 0.35, g.y + g.h * 0.4, 4, 0, Math.PI * 2);
                    ctx.arc(sx + g.w * 0.65, g.y + g.h * 0.4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(sx + g.w * 0.35, g.y + g.h * 0.4, 2, 0, Math.PI * 2);
                    ctx.arc(sx + g.w * 0.65, g.y + g.h * 0.4, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawPowerups() {
                for (const pu of powerups) {
                    if (pu.life <= 0) continue;
                    const sx = pu.x - cameraX;
                    if (sx < -60 || sx > W + 60) continue;
                    if (pu.life < 60 && Math.floor(pu.life / 5) % 2 === 0) continue;
                    const bob = Math.sin(animTimer * 0.1) * 3;
                    ctx.save();
                    ctx.translate(sx + pu.w / 2, pu.y + pu.h / 2 + bob);
                    if (pu.type === 'mushroom') {
                        ctx.fillStyle = '#ff6ec7';
                        ctx.beginPath();
                        ctx.arc(0, -2, pu.w / 2, Math.PI, 0);
                        ctx.fill();
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(-5, -4, 3, 0, Math.PI * 2);
                        ctx.arc(5, -4, 3, 0, Math.PI * 2);
                        ctx.arc(0, -10, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#f9d5a7';
                        ctx.fillRect(-6, 0, 12, 12);
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(-3, 5, 1.5, 0, Math.PI * 2);
                        ctx.arc(3, 5, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (pu.type === 'shield') {
                        ctx.fillStyle = '#00e5ff';
                        ctx.beginPath();
                        ctx.moveTo(0, -12);
                        ctx.lineTo(12, -6);
                        ctx.lineTo(12, 6);
                        ctx.lineTo(0, 14);
                        ctx.lineTo(-12, 6);
                        ctx.lineTo(-12, -6);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 12px monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('🛡', 0, 1);
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'alphabetic';
                    } else {
                        ctx.fillStyle = '#b06ab3';
                        ctx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
                            const a2 = a + Math.PI / 5;
                            ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 14);
                            ctx.lineTo(Math.cos(a2) * 6, Math.sin(a2) * 6);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#ff6ec7';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }

            function drawParticles() {
                for (const pt of particles) {
                    const sx = pt.x - cameraX;
                    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
                    ctx.fillStyle = pt.color;
                    ctx.beginPath();
                    ctx.arc(sx, pt.y, pt.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            function drawPlayer() {
                const px = player.x - cameraX,
                    py = player.y,
                    w = player.width,
                    h = player.height;
                // Animation bounce
                let bounce = 0;
                let legOffset = 0;
                if (player.walkFrame === 1) legOffset = 2;
                else if (player.walkFrame === 3) legOffset = -2;
                if (player.walkFrame === 1 || player.walkFrame === 3) bounce = -1;
                if (!player.onGround) {
                    bounce = -2;
                    legOffset = 0;
                }

                // Idle breathing
                if (player.idleTimer > 60) {
                    bounce += Math.sin(animTimer * 0.1) * 0.5;
                }

                // Shield effect
                if (shieldActive) {
                    ctx.strokeStyle = `rgba(0, 229, 255, ${0.5 + Math.sin(animTimer * 0.1) * 0.3})`;
                    ctx.lineWidth = 4;
                    ctx.shadowColor = '#00e5ff';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(px + w / 2, py + h / 2, w * 0.95, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                if (invincibleTimer > 0 && Math.floor(invincibleTimer / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.beginPath();
                ctx.ellipse(px + w / 2, py + h + 4, w * 0.6, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // --- Pixel art hero (detailed) ---
                // Cape
                ctx.fillStyle = '#c0392b';
                const capeSway = Math.sin(animTimer * 0.1) * 2;
                ctx.beginPath();
                ctx.moveTo(px + 4, py + 8 + bounce);
                ctx.lineTo(px + w + 2 + capeSway, py + 20 + bounce);
                ctx.lineTo(px + w - 2 + capeSway, py + h - 5 + bounce);
                ctx.lineTo(px + 6, py + h - 10 + bounce);
                ctx.closePath();
                ctx.fill();

                // Body suit
                ctx.fillStyle = '#e63946';
                ctx.fillRect(px, py + 10 + bounce, w, h * 0.55);
                // Pants
                ctx.fillStyle = '#1e4b8f';
                ctx.fillRect(px, py + h * 0.55 + bounce, w, h * 0.45);
                // Belt
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(px, py + h * 0.52 + bounce, w, 4);
                ctx.fillStyle = '#b7950b';
                ctx.fillRect(px + w / 2 - 3, py + h * 0.52 + bounce, 6, 4);

                // Arms
                ctx.fillStyle = '#e63946';
                const armSwing = Math.sin(animTimer * 0.15) * 2;
                if (player.facing === 1) {
                    ctx.fillRect(px + w - 3, py + 14 + bounce + armSwing, 5, 12);
                    ctx.fillStyle = '#f9d5a7';
                    ctx.fillRect(px + w - 3, py + 26 + bounce + armSwing, 5, 5);
                } else {
                    ctx.fillRect(px - 2, py + 14 + bounce + armSwing, 5, 12);
                    ctx.fillStyle = '#f9d5a7';
                    ctx.fillRect(px - 2, py + 26 + bounce + armSwing, 5, 5);
                }

                // Head
                ctx.fillStyle = '#f9d5a7';
                ctx.beginPath();
                ctx.ellipse(px + w / 2, py + 8 + bounce, w / 2 - 3, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                // Hair
                ctx.fillStyle = '#4a2e1b';
                ctx.beginPath();
                ctx.ellipse(px + w / 2, py + 2 + bounce, w / 2 - 2, 5, 0, Math.PI, 0);
                ctx.fill();

                // Hat (magical)
                ctx.fillStyle = '#d62828';
                ctx.beginPath();
                ctx.ellipse(px + w / 2, py - 1 + bounce, w / 2 + 3, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                // Hat brim
                ctx.fillStyle = '#b11e1e';
                if (player.facing === 1) {
                    ctx.fillRect(px + w - 8, py - 5 + bounce, 14, 5);
                } else {
                    ctx.fillRect(px - 6, py - 5 + bounce, 14, 5);
                }
                // Hat star
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(px + w / 2, py - 4 + bounce, 3, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#1a1a1a';
                if (player.facing === 1) {
                    ctx.beginPath();
                    ctx.arc(px + w - 10, py + 7 + bounce, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(px + w - 11, py + 6 + bounce, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(px + 10, py + 7 + bounce, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(px + 9, py + 6 + bounce, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Mustache
                ctx.fillStyle = '#4a2e1b';
                ctx.beginPath();
                if (player.facing === 1) {
                    ctx.ellipse(px + w - 12, py + 14 + bounce, 6, 2.5, 0, 0, Math.PI * 2);
                } else {
                    ctx.ellipse(px + 12, py + 14 + bounce, 6, 2.5, 0, 0, Math.PI * 2);
                }
                ctx.fill();

                // Boots
                ctx.fillStyle = '#3d2b1a';
                ctx.fillRect(px + 2 + legOffset, py + h - 5 + bounce, 10, 6);
                ctx.fillRect(px + w - 12 - legOffset, py + h - 5 + bounce, 10, 6);
                // Boot shine
                ctx.fillStyle = '#5c3a1e';
                ctx.fillRect(px + 4 + legOffset, py + h - 4 + bounce, 4, 2);
                ctx.fillRect(px + w - 10 - legOffset, py + h - 4 + bounce, 4, 2);

                // Gloves
                ctx.fillStyle = '#f0f0f0';
                if (player.facing === 1) {
                    ctx.fillRect(px + w - 4, py + 26 + bounce + armSwing, 6, 6);
                } else {
                    ctx.fillRect(px - 2, py + 26 + bounce + armSwing, 6, 6);
                }

                ctx.globalAlpha = 1;
            }

            function drawHUD(theme) {
                // Progress bar
                const barW = 320,
                    barH = 12;
                const barX = (W - barW) / 2,
                    barY = H - 28;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX, barY, barW, barH);
                const prog = Math.min(1, player.x / (WORLD_W - 100));
                const grad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
                grad.addColorStop(0, theme.accent);
                grad.addColorStop(0.5, '#ffe066');
                grad.addColorStop(1, theme.accent);
                ctx.fillStyle = grad;
                ctx.fillRect(barX, barY, barW * prog, barH);
                ctx.strokeStyle = 'rgba(0,0,0,0.6)';
                ctx.lineWidth = 2;
                ctx.strokeRect(barX, barY, barW, barH);
                // Flag
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('🏁', barX + barW - 4, barY + 11);
                ctx.textAlign = 'left';

                // Coin counter
                const left = coins.filter(c => !c.collected).length;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(W - 130, 14, 110, 34);
                ctx.strokeStyle = theme.accent;
                ctx.lineWidth = 2;
                ctx.strokeRect(W - 130, 14, 110, 34);
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 18px monospace';
                ctx.fillText('🪙 ' + left, W - 118, 38);

                // Lives (hearts)
                for (let i = 0; i < player.lives; i++) {
                    ctx.fillStyle = '#ff6ec7';
                    ctx.font = '20px monospace';
                    ctx.fillText('❤', 16 + i * 26, 32);
                }

                // Active effects
                let px = 16;
                if (shieldActive) {
                    ctx.fillStyle = '#00e5ff';
                    ctx.font = 'bold 14px monospace';
                    ctx.fillText('🛡 ' + Math.ceil(shieldTimer / 60) + 's', px, 60);
                    px += 70;
                }
                if (invincibleTimer > 0) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = 'bold 14px monospace';
                    ctx.fillText('★ ' + Math.ceil(invincibleTimer / 60) + 's', px, 60);
                }

                // Theme name
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(theme.name, W - 20, H - 45);
                ctx.textAlign = 'left';
            }

            function drawOverlay(title, sub, color) {
                ctx.fillStyle = 'rgba(10, 5, 30, 0.8)';
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';
                ctx.font = 'bold 54px "Courier New", monospace';
                ctx.fillStyle = color;
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 30;
                ctx.fillText(title, W / 2, H / 2 - 20);
                ctx.font = '26px monospace';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(sub, W / 2, H / 2 + 45);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }

            // ---------- GAME LOOP ----------
            const FIXED_STEP = 1000 / 60;
            const SLOWDOWN = 1.7;
            let lastTime = 0;
            let accumulator = 0;

            function updateGame() {
                animTimer++;
                if (transitionAlpha > 0) {
                    transitionAlpha -= 0.04;
                }
                if (!gameOver && !levelComplete && !allDone) updatePlayer();
                if (levelComplete && !allDone) {
                    completeTimer--;
                    if (completeTimer <= 0) {
                        transitionAlpha = 1;
                        nextLevel();
                    }
                }
            }

            function renderGame() {
                const theme = THEMES[currentLevel];
                drawBackground(theme);
                drawWaterfalls(theme);
                drawPlatforms(theme);
                drawCoins();
                drawTreasures();
                drawPowerups();
                drawEnemies();
                drawGerms();
                drawParticles();
                drawPlayer();
                drawHUD(theme);

                // Transition fade
                if (transitionAlpha > 0) {
                    ctx.fillStyle = `rgba(10, 5, 30, ${transitionAlpha})`;
                    ctx.fillRect(0, 0, W, H);
                }

                if (gameOver) {
                    drawOverlay('GAME OVER', 'press RESTART or SPACE', '#ff6ec7');
                } else if (allDone) {
                    drawOverlay('🎉 YOU WIN! 🎉', 'all 10 levels complete · press RESTART', '#f1c40f');
                } else if (levelComplete) {
                    drawOverlay('LEVEL ' + (currentLevel + 1) + ' COMPLETE!', 'next level loading...', '#2ecc71');
                }
            }

            function gameLoop(timestamp) {
                if (!lastTime) lastTime = timestamp;
                let delta = timestamp - lastTime;
                lastTime = timestamp;
                if (delta > 200) delta = 200;

                accumulator += delta;
                const stepReal = FIXED_STEP * SLOWDOWN;

                let steps = 0;
                while (accumulator >= stepReal && steps < 5) {
                    updateGame();
                    accumulator -= stepReal;
                    steps++;
                }
                if (steps === 5) accumulator = 0;

                renderGame();
                requestAnimationFrame(gameLoop);
            }

            // ---------- EVENTS ----------
            window.addEventListener('keydown', (e) => {
                if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
                if (e.code in keys) keys[e.code] = true;
                if ((gameOver || allDone) && (e.code === 'Space' || e.code === 'KeyR')) resetGame();
            });
            window.addEventListener('keyup', (e) => {
                if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
                if (e.code in keys) keys[e.code] = false;
            });
            document.getElementById('restartButton').addEventListener('click', resetGame);
            canvas.addEventListener('click', () => {
                if (gameOver || allDone) resetGame();
            });

            // ---------- START ----------
            resetGame();
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
